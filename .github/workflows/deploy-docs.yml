name: Deploy Pages (docs + builder)

on:
  push:
    branches:
      - develop
    paths:
      - 'projects/reformer-doc/**'
      - 'projects/reformer-builder/**'
      - 'packages/reformer/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # npm ci использует package-lock.json для повторяемой сборки.
        # Раньше тут было `rm package-lock.json && npm install` — это давало
        # каждый раз свежий resolve с npm, что приводило к несовместимости
        # transitive deps (например webpackbar с новым webpack ProgressPlugin
        # после bump Node 22).
        run: npm ci

      - name: Build workspace packages
        # reformer-doc импортирует @reformer/* по их `exports` (→ dist/),
        # поэтому пакеты нужно собрать ДО сборки доков (в порядке зависимостей).
        # Иначе docusaurus build падает с «no valid target file was found».
        run: |
          npm run build -w @reformer/core
          npm run build -w @reformer/cdk
          npm run build -w @reformer/renderer-json
          npm run build -w @reformer/renderer-react
          npm run build -w @reformer/ui-kit

      - name: Build documentation
        run: npm run build -w reformer-doc

      - name: Build builder
        # Vite-SPA. base=/ReFormer/builder/ нужен, чтобы ассеты и Monaco-воркеры
        # (резолвятся относительно base через import.meta.url) грузились из подкаталога.
        env:
          BUILDER_BASE: /ReFormer/builder/
        run: npm run build -w reformer-builder

      - name: Assemble site (docs at root, builder under /builder)
        # У репозитория один Pages-артефакт: docs кладём в корень, builder — в /builder.
        # .nojekyll из docs-сборки попадает в корень и отключает Jekyll для всего сайта.
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r projects/reformer-doc/build/. _site/
          mkdir -p _site/builder
          cp -r projects/reformer-builder/dist/. _site/builder/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
