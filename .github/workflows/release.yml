name: Release

# Единый release-workflow для всех пакетов monorepo. Один последовательный джоб:
# один checkout + один `npm ci` + одна сборка всех пакетов в топо-порядке, затем
# semantic-release по каждому пакету последовательно в цикле.
#
# Почему не matrix: раньше был matrix с `max-parallel: 1` (сериализация ради
# race на общий ref `refs/notes/semantic-release`). Но max-parallel:1 не даёт
# параллелизма — только оверхед: 6× checkout, 6× npm ci, 18 пересборок. Единый
# джоб убирает это (1× npm ci, 7 build-ов) и попутно снимает саму гонку notes
# (один процесс, локальный ref обновляется сам — max-parallel не нужен).
#
# Изоляция сбоев (замена fail-fast: false): release-цикл ловит падение каждого
# пакета через `if ( … )`, копит упавшие и падает в конце — один сбой не
# блокирует публикацию остальных. Падение СБОРКИ линейно прерывает джоб до
# релиза (нельзя публиковать из несобранного; needs: test уже собрал те же
# пакеты). Если в пакете нет новых коммитов — semantic-release пишет
# "no release needed" и выходит с code 0.

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/**'
      - 'projects/reformer-builder/**'
      - '.github/workflows/release.yml'
  workflow_dispatch: # для ручного re-run без коммита (например после исправления git tags)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: ничего не публикуется, пока CI не зелёный (lint + format + build + tests).
  # Тот же переиспользуемый workflow, что и в ci.yml — единый источник правды.
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Release all packages
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages in dependency order
        # Один раз собираем ВСЕ пакеты в топологическом порядке (тот же, что в
        # test.yml и align-versions.yml). Корневой `npm run build --workspaces`
        # НЕ годится: npm не топо-сортирует workspaces (mcp/tsc собрался бы до
        # своих dist-зависимостей → TS2307) и захватил бы projects/*.
        run: |
          for pkg in @reformer/core @reformer/cdk @reformer/renderer-react \
                     @reformer/ui-kit @reformer/renderer-json @reformer/form-registry \
                     @reformer/mcp; do
            echo "::group::Build $pkg"
            npm run build -w "$pkg"
            echo "::endgroup::"
          done

      - name: Build @reformer/builder (npm base '/')
        # Билдер — Vite-SPA (projects/*), публикуется prebuilt-бандлом. Собираем ПОСЛЕ 6 пакетов:
        # tsc -b / vite build резолвят пять @reformer/* из их собранного dist, а contract.ts
        # инлайнит @reformer/ui-kit/catalog. BUILDER_BASE НЕ выставляем → base '/' (в отличие от
        # Pages-сборки в deploy-docs.yml), чтобы ассеты/Monaco-воркеры грузились с корня статик-сервера.
        run: npm run build -w @reformer/builder

      # Тесты не повторяем: needs: test (reusable test.yml) уже собрал и прогнал
      # тесты всех пакетов + dist-deps/size/typecheck.

      - name: Fetch git notes
        # checkout не тянет refs/notes/*, а semantic-release хранит там каналы
        # релиза. Тянем ОДИН раз перед циклом — внутри одного джоба каждый
        # semantic-release сам обновляет локальный ref, между пакетами fetch не
        # нужен, а гонки параллельных runner-ов больше нет.
        run: git fetch origin refs/notes/semantic-release:refs/notes/semantic-release || true

      - name: Release all packages (sequential, fault-isolated)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # workspace:dir в топологическом порядке.
          packages=(
            "@reformer/core:packages/reformer"
            "@reformer/cdk:packages/reformer-cdk"
            "@reformer/renderer-react:packages/reformer-renderer-react"
            "@reformer/ui-kit:packages/reformer-ui-kit"
            "@reformer/renderer-json:packages/reformer-renderer-json"
            "@reformer/form-registry:packages/reformer-form-registry"
            "@reformer/mcp:packages/reformer-mcp"
            "@reformer/builder:projects/reformer-builder"
          )
          failed=()
          for entry in "${packages[@]}"; do
            ws="${entry%%:*}"
            dir="${entry#*:}"
            echo "::group::Release $ws"
            # Команда в условии `if` не срабатывает под set -e, поэтому один
            # упавший пакет не рвёт цикл. "no release needed" → exit 0 (не сбой);
            # реальный сбой публикации → exit != 0 → копим и падаем в конце.
            if ( cd "$dir" && npx semantic-release ); then
              echo "$ws: done"
            else
              echo "::error::semantic-release failed for $ws"
              failed+=("$ws")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Release failed for: ${failed[*]}"
            exit 1
          fi

      - name: Sync dist-tag beta → develop
        # semantic-release публикует prerelease под dist-tag, равным имени ветки, то
        # есть `develop` — привычное `npm i @reformer/core@beta` не работает.
        #
        # Задать "channel": "beta" в .releaserc.json НЕЛЬЗЯ: канал участвует в расчёте
        # номера prerelease. На «пустом» канале beta отсчёт начинается заново с
        # X.Y.Z-beta.1 (проверено dry-run: с channel → 10.0.0-beta.1 вместо beta.4), а
        # эти версии уже опубликованы — npm ответил бы E403 "cannot publish over the
        # previously published versions". Поэтому канал остаётся develop, а beta
        # навешивается алиасом на ту же версию.
        #
        # Список пакетов не дублируем: берём каждый каталог, где лежит .releaserc.json.
        # Алиас — косметика поверх состоявшейся публикации, поэтому его сбой не должен
        # ронять джоб: только ::warning::.
        if: github.ref == 'refs/heads/develop'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          for rc in packages/*/.releaserc.json projects/*/.releaserc.json; do
            dir=$(dirname "$rc")
            ws=$(node -p "require('./$dir/package.json').name")
            v=$(npm view "$ws@develop" version 2>/dev/null || true)
            if [ -z "$v" ]; then
              echo "$ws: develop-версии в npm нет, пропуск"
              continue
            fi
            if [ "$(npm view "$ws@beta" version 2>/dev/null || true)" = "$v" ]; then
              echo "$ws: beta уже указывает на $v"
              continue
            fi
            if npm dist-tag add "$ws@$v" beta; then
              echo "$ws: beta → $v"
            else
              echo "::warning::не удалось навесить dist-tag beta на $ws@$v"
            fi
          done

      - name: Back-merge main → develop
        # Stable-теги semantic-release ставит на HEAD main, а это merge-коммит PR
        # develop→main (49376483, 8c20c448, …). Такой коммит НЕ предок develop, поэтому
        # на develop не виден ни один stable-тег: база для prerelease берётся от
        # последней беты, и беты нумеруются от устаревшего мажора (core: latest 10.2.0
        # против develop-беты 10.0.0-beta.3). Возвращаем main в develop сразу после
        # публикации — следующая бета считается уже от актуального тега.
        #
        # Только на main: на develop релизится сама develop, мержить нечего.
        # Merge пустой по содержимому (develop уже имеет эти изменения, не хватает
        # только merge-коммита), поэтому paths-фильтр обычно не триггерит новый
        # Release — беты поедут со следующим реальным коммитом, но уже от верной базы.
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git checkout -B develop origin/develop
          if git merge --no-edit origin/main; then
            git push origin develop
            echo "develop синхронизирован с main"
          else
            git merge --abort || true
            echo "::error::Back-merge main → develop конфликтует. Публикация пакетов" \
                 "УЖЕ ПРОШЛА успешно — красный джоб означает только то, что слияние" \
                 "надо сделать руками: git checkout develop && git merge main."
            exit 1
          fi
