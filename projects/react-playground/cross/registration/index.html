<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Регистрация — React, @reformer/ui-kit</title>
    <!-- Первая отметка страницы: до загрузки и исполнения модулей (замеры, forms-benchmark). -->
    <script>
      performance.mark('bench:html');
    </script>
    <!--
      Тема — как у соседних страниц на Vuetify и Taiga UI: по prefers-color-scheme. ui-kit включает
      тёмную тему классом .dark; в демо на сайте тему задаёт color-scheme у iframe.
    -->
    <script>
      (function () {
        var media = matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.classList.toggle('dark', media.matches);
        };
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/cross/registration/main.tsx"></script>
  </body>
</html>
